<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="300" height="170">
  <defs>
    <linearGradient id="tpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005A36" />
      <stop offset="100%" stop-color="#28a745" />
    </linearGradient>
  </defs>
  
  <!-- Emblem Shield / Circle Icon -->
  <g transform="translate(160, 52)">
    <circle cx="0" cy="0" r="38" fill="url(#tpuGrad)" />
    <!-- Lettering or graphic inside circle -->
    <path d="M-18 -16 L18 -16 L18 -8 L4 -8 L4 18 L-4 18 L-4 -8 L-18 -8 Z" fill="#ffffff" />
    <circle cx="0" cy="-6" r="3" fill="#ffffff" opacity="0.8"/>
    <path d="M-22 18 C-10 26, 10 26, 22 18" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Big Acronym "Т П У" -->
  <text x="160" y="122" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="28" font-weight="900" fill="#005A36" text-anchor="middle" letter-spacing="4">
    Т П У
  </text>

  <!-- Full Name -->
  <text x="160" y="144" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="11" font-weight="700" fill="#2d3748" text-anchor="middle" letter-spacing="0.5">
    ТОМСКИЙ ПОЛИТЕХНИЧЕСКИЙ
  </text>
  
  <text x="160" y="158" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="11" font-weight="700" fill="#2d3748" text-anchor="middle" letter-spacing="0.5">
    УНИВЕРСИТЕТ
  </text>

  <!-- Subtitle -->
  <text x="160" y="172" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#718096" text-anchor="middle" letter-spacing="1.5">
    ОСНОВАН В 1896 ГОДУ
  </text>
</svg>
